#
# Builds "The Forge.app" on GitHub's own Mac, so nothing has to be
# downloaded or built on your Mac. The app is UNIVERSAL: one app that runs on
# Intel Macs (such as a 2019 MacBook Pro) and on Apple silicon Macs.
#
# It runs by itself whenever something is uploaded to the repository, and by
# hand from the Actions tab ("Build The Forge for Mac", "Run workflow").
# The result, The-Forge-Mac.zip, is placed on the Releases page and under
# "Artifacts" on the run's page. Installing it is a copy, not a build.

name: Build The Forge for Mac

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Get the project
        uses: actions/checkout@v4

      - name: Find the project folder
        run: |
          F=$(find . -name the_forge.spec -not -path './.git/*' | head -n 1)
          if [ -z "$F" ]; then echo "the_forge.spec not found. Upload the CONTENTS of the Mac project folder."; exit 1; fi
          echo "PROJ=$(dirname "$F")" >> "$GITHUB_ENV"
          echo "Project folder: $(dirname "$F")"

      - name: Install Python 3.12 for Intel and Apple silicon
        # python.org's own installer is "universal2": it carries both kinds of
        # Mac code, which a universal app needs. 3.12.10 is the last 3.12
        # release that has a Mac installer.
        run: |
          curl -sSL --retry 4 -o "$RUNNER_TEMP/python.pkg" https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target / > /dev/null
          PY=/Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12
          "$PY" --version
          echo "Python carries: $(lipo -archs /Library/Frameworks/Python.framework/Versions/3.12/Python)"
          "$PY" -m venv "$RUNNER_TEMP/venv"
          echo "VPY=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"

      - name: Install the build tools
        run: |
          "$VPY" -m pip install --quiet --upgrade pip
          "$VPY" -m pip install --quiet pyinstaller pywebview
          "$VPY" -m pip list | grep -i -E "pyinstaller|pywebview|pyobjc-core" || true

      - name: Check every compiled part is universal
        # A universal app can only be made from parts that carry both kinds of
        # Mac code. Any part that does not is named here, before building.
        run: |
          BAD=0
          while IFS= read -r f; do
            A=$(lipo -archs "$f" 2>/dev/null || echo "?")
            case "$A" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "NOT UNIVERSAL ($A): $f"; BAD=1 ;; esac
          done < <(find "$RUNNER_TEMP/venv/lib" \( -name "*.so" -o -name "*.dylib" \))
          if [ "$BAD" = 1 ]; then exit 1; fi
          echo "Every compiled part carries Intel and Apple silicon code."

      - name: Build The Forge.app
        env:
          CD_TARGET_ARCH: universal2
        run: |
          cd "$PROJ"
          set -o pipefail
          "$VPY" -m PyInstaller --noconfirm --clean the_forge.spec 2>&1 | tee "$RUNNER_TEMP/build-log.txt"
          test -d "dist/The Forge.app"
          echo "The app carries: $(lipo -archs "dist/The Forge.app/Contents/MacOS/The Forge")"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "dist/The Forge.app/Contents/Info.plist"

      - name: If the build failed, show why
        if: failure()
        run: tail -n 80 "$RUNNER_TEMP/build-log.txt" || echo "(no build log was written)"

      - name: Open the app once, as Apple silicon and as Intel
        # Starts the finished app for 40 seconds each way, checks its page server
        # answers, photographs the screen twice, and reads the app's own log.
        # The Intel run uses Rosetta, Apple's translator, as an Intel Mac would
        # run the Intel half natively.
        run: |
          cd "$PROJ"
          APP="dist/The Forge.app/Contents/MacOS/The Forge"
          LOG="dist/The Forge.app/Contents/MacOS/the_forge_crash.log"
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            softwareupdate --install-rosetta --agree-to-license > /dev/null 2>&1 || true
          fi
          for MODE in arm64 x86_64; do
            rm -f "$LOG" "$HOME/the_forge_crash.log"
            arch -$MODE "$APP" > "$RUNNER_TEMP/run-$MODE.txt" 2>&1 &
            PID=$!
            mkdir -p "$RUNNER_TEMP/shots"
            # the app serves its page from this Mac only; it must answer. Asked every 2 seconds for up to 40:
            # the first start as Intel runs through Rosetta, which translates the app before it runs, so it
            # can take longer than 12 seconds to begin serving, while a late answer is still a working app.
            CODE=000; T=0
            while [ $T -lt 40 ]; do
              sleep 2; T=$((T+2))
              CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:42001/the_forge.html || true)
              if [ "$CODE" = "200" ]; then break; fi
            done
            echo "$MODE: the app's page server answered $CODE after $T seconds"
            # 647: the page must go out marked not to be kept, or the web view can show a page kept from an earlier build
            HDR=$(curl -s -D - -o /dev/null --max-time 5 http://127.0.0.1:42001/the_forge.html | tr -d '\r' | grep -i '^cache-control:' || true)
            echo "$MODE: the page's caching header: ${HDR:-none}"
            case "$HDR" in *no-store*) ;; *) echo "$MODE: the page is not marked no-store, so a new build could show an old page"; exit 1;; esac
            screencapture -x "$RUNNER_TEMP/shots/mac-$MODE-first.png" 2>/dev/null || echo "no screenshot"
            if [ $T -lt 40 ]; then sleep $((40-T)); fi
            screencapture -x "$RUNNER_TEMP/shots/mac-$MODE-40s.png" 2>/dev/null || echo "no screenshot"
            if kill -0 $PID 2>/dev/null; then echo "$MODE: still running after 40 seconds"; kill $PID; sleep 3; else echo "$MODE: EXITED EARLY"; exit 1; fi
            if [ "$CODE" != "200" ]; then echo "$MODE: the page server did not answer, so the window would be blank"; exit 1; fi
            echo "--- what the app recorded ($MODE) ---"
            cat "$LOG" 2>/dev/null || cat "$HOME/the_forge_crash.log" 2>/dev/null || echo "(nothing)"
            if grep -q "Traceback" "$LOG" "$HOME/the_forge_crash.log" 2>/dev/null; then echo "$MODE: a fault was recorded"; exit 1; fi
            echo "$MODE: $(grep -h 'page: build' "$LOG" "$HOME/the_forge_crash.log" 2>/dev/null | tail -1 || true)"
          done
          # 647: the first start of this build emptied the web view's cache of pages (the build is noted for the next start)
          cat "$HOME/Library/Application Support/TheForge/page_build.txt" 2>/dev/null && echo " (the build noted)" || { echo "the build was not noted: the page cache was not emptied"; exit 1; }
          rm -f "$LOG"

      - name: Quit the app three times as a person does, then open it again
        # Quit (the menu, Command+Q, the Dock) is not the same as closing the
        # window: macOS ends the app straight away. The app keeps a mark of
        # starts that did not end cleanly and, after two, opens in the browser
        # instead of its own window. Every ordinary Quit must be a clean
        # ending, and the fourth start must still open the app's own window.
        run: |
          cd "$PROJ"
          APPDIR="$PWD/dist/The Forge.app"
          FLAG="$HOME/Library/Application Support/TheForge/the_forge_session.flag"
          LOG="dist/The Forge.app/Contents/MacOS/the_forge_crash.log"
          rm -f "$FLAG" "$LOG" "$HOME/the_forge_crash.log"
          mkdir -p "$RUNNER_TEMP/shots"
          BAD=0
          for N in 1 2 3; do
            open -n "$APPDIR"
            sleep 20
            osascript -e 'tell application "The Forge" to quit' || echo "run $N: the Quit was not delivered"
            sleep 5
            if pgrep -f "The Forge.app/Contents/MacOS/The Forge" > /dev/null; then echo "run $N: still running after Quit"; pkill -f "The Forge.app/Contents/MacOS/The Forge"; sleep 3; BAD=1; fi
            if [ -f "$FLAG" ]; then echo "run $N: Quit left the mark of a bad ending ($(cat "$FLAG"))"; BAD=1; else echo "run $N: Quit was a clean ending"; fi
          done
          open -n "$APPDIR"
          sleep 20
          screencapture -x "$RUNNER_TEMP/shots/mac-after-three-quits.png" 2>/dev/null || echo "no screenshot"
          echo "--- what the app recorded ---"
          cat "$LOG" 2>/dev/null || cat "$HOME/the_forge_crash.log" 2>/dev/null || echo "(nothing)"
          osascript -e 'tell application "The Forge" to quit' || true
          sleep 5
          pkill -f "The Forge.app/Contents/MacOS/The Forge" || true
          if grep -q "two bad endings" "$LOG" "$HOME/the_forge_crash.log" 2>/dev/null; then echo "RESULT: the fourth start opened the browser instead of the window"; exit 1; fi
          if [ "$BAD" = 1 ]; then echo "RESULT: a Quit did not end the app cleanly"; exit 1; fi
          echo "RESULT: every Quit was clean, and the fourth start opened the app's own window"
          rm -f "$LOG"

      - name: Keep the screenshots with this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: warn

      - name: Pack the app
        run: |
          cd "$PROJ/dist"
          ditto -c -k --sequesterRsrc --keepParent "The Forge.app" "$GITHUB_WORKSPACE/The-Forge-Mac.zip"
          ls -la "$GITHUB_WORKSPACE/The-Forge-Mac.zip"

      - name: Keep the app with this run
        uses: actions/upload-artifact@v4
        with:
          name: the-forge-mac
          path: The-Forge-Mac.zip
          if-no-files-found: error

      - name: Put the app on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=the-forge-mac
          PASS=$(grep -m1 '^Pass:' "$PROJ/BUILD_INFO.txt" | tr -dc '0-9')
          NOTES="The Forge for Mac, build ${PASS}. One app for Intel and Apple silicon Macs. Built $(date -u '+%d %B %Y, %H:%M UTC') from branch ${GITHUB_REF_NAME}, commit ${GITHUB_SHA:0:7}.
          Unzip, drag The Forge.app to Applications, then follow the READ ME for the first open."
          # GitHub's upload server sometimes answers with an error of its own
          # (HTTP 500), and a later try goes through. Four tries, further apart.
          publish() {
            if gh release view "$TAG" > /dev/null 2>&1; then
              gh release upload "$TAG" The-Forge-Mac.zip --clobber
            else
              gh release create "$TAG" The-Forge-Mac.zip --target "$GITHUB_SHA" --title "The Forge for Mac" --notes "$NOTES"
            fi
          }
          OK=0
          for WAIT in 0 15 30 60; do
            if [ "$WAIT" -gt 0 ]; then echo "GitHub did not accept it; trying again in $WAIT seconds."; sleep "$WAIT"; fi
            if publish; then OK=1; break; fi
          done
          if [ "$OK" != 1 ]; then echo "::error::GitHub did not accept The-Forge-Mac.zip after four tries. Run the workflow again later. If an error above says 403 or 'Resource not accessible': Settings, Actions, General, Workflow permissions: Read and write."; exit 1; fi
          gh release edit "$TAG" --notes "$NOTES" || echo "The release notes could not be updated; the app is in place."
